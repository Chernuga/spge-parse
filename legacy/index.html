<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Schedule Viewer – Period Grid</title>
<style>
    :root {
        --bg: #000; --surface: #111; --surface2: #1a1a1a; --border: #333;
        --text: #fff; --text-muted: #aaa; --text-secondary: #ccc;
        --input-bg: #1a1a1a; --input-border: #444;
        --card-bg: #000; --card-border: #555;
        --btn-bg: #2a2a2a; --btn-border: #555;
        --accent: #2563eb; --accent-hover: #1d4ed8; --green: #22c55e;
        --blue-bg: rgba(37,99,235,0.15); --green-bg: rgba(34,197,94,0.15);
        --day-header-border: #333;
        --schedule-label-a-color: #93c5fd; --schedule-label-b-color: #86efac;
    }
    body.light-mode {
        --bg: #f5f5f5; --surface: #ffffff; --surface2: #f0f0f0; --border: #ddd;
        --text: #111; --text-muted: #666; --text-secondary: #333;
        --input-bg: #ffffff; --input-border: #ccc;
        --card-bg: #ffffff; --card-border: #ddd;
        --btn-bg: #e0e0e0; --btn-border: #bbb;
        --blue-bg: #e8f0fe; --green-bg: #e8f5e9;
        --day-header-border: #ccc;
        --schedule-label-a-color: #1e40af; --schedule-label-b-color: #166534;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background: var(--bg); color: var(--text);
        font-family: 'Inter', system-ui, sans-serif;
        padding: 16px 12px; min-height: 100vh;
        display: flex; flex-direction: column; align-items: center;
        transition: background 0.3s, color 0.3s;
    }
    .container { width: 100%; max-width: 480px; }
    .import-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .import-header h2 { font-size: 1.4rem; font-weight: 600; color: var(--text); margin: 0; }
    .theme-toggle { background: var(--btn-bg); border: 1px solid var(--btn-border); color: var(--text); border-radius: 20px; padding: 4px 12px; font-size: 0.8rem; cursor: pointer; transition: background 0.2s; white-space: nowrap; }
    .theme-toggle:hover { background: var(--accent-hover); color: #fff; }

    .import-section { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); transition: background 0.3s, border-color 0.3s; }
    .tab-row { display: flex; gap: 0; margin-bottom: 14px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
    .tab-btn { flex: 1; background: var(--surface2); color: var(--text-muted); border: none; padding: 10px 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; border-right: 1px solid var(--border); }
    .tab-btn:last-child { border-right: none; }
    .tab-btn.active { background: var(--accent); color: #fff; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    textarea, input[type="url"] {
        width: 100%; background: var(--input-bg); border: 1px solid var(--input-border);
        border-radius: 8px; color: var(--text); padding: 12px; font-family: monospace;
        font-size: 13px; line-height: 1.4; margin-bottom: 8px; resize: vertical; min-height: 120px;
    }
    input[type="url"] { min-height: auto; padding: 8px 10px; font-size: 0.8rem; }
    .file-upload { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    button { background: var(--btn-bg); color: var(--text); border: 1px solid var(--btn-border); border-radius: 8px; padding: 10px 18px; font-weight: 500; font-size: 0.95rem; cursor: pointer; transition: background 0.2s, border-color 0.2s; }
    button:active { background: var(--accent-hover); }
    .btn-primary { background: var(--accent); border-color: var(--accent); font-weight: 600; color: #fff; }
    .btn-primary:disabled { background: #666; border-color: #777; color: #ccc; cursor: not-allowed; }
    .btn-sm { padding: 6px 12px; font-size: 0.78rem; border-radius: 6px; }
    .url-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .url-item { display: flex; align-items: center; gap: 8px; }
    .url-item label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); width: 50px; flex-shrink: 0; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

    /* ===================== Custom Select ===================== */
    .custom-select {
        position: relative;
        font-size: 0.85rem;
        color: var(--text);
        min-width: 0;
    }
    .custom-select-trigger {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 6px;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        text-align: left;
        transition: border-color 0.15s, background 0.15s;
    }
    .custom-select-trigger:hover { border-color: var(--accent); }
    .custom-select-trigger:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .custom-select.open .custom-select-trigger { border-color: var(--accent); }
    .custom-select-label {
        flex: 1; min-width: 0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .custom-select-caret {
        font-size: 0.65rem; opacity: 0.7; flex-shrink: 0;
        transition: transform 0.15s;
    }
    .custom-select.open .custom-select-caret { transform: rotate(180deg); }
    .custom-select-menu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0; right: 0;
        max-height: 260px;
        overflow-y: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.45);
        z-index: 100;
        display: none;
        padding: 4px;
    }
    .custom-select.open .custom-select-menu { display: block; }
    .custom-select-option {
        padding: 8px 10px;
        border-radius: 4px;
        cursor: pointer;
        color: var(--text);
        font-size: 0.85rem;
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px;
        transition: background 0.1s;
    }
    .custom-select-option:hover,
    .custom-select-option.focused { background: var(--surface2); }
    .custom-select-option.selected { background: var(--accent); color: #fff; }
    .custom-select-option.selected::after { content: '✓'; font-size: 0.75rem; }
    .custom-select-option.empty {
        color: var(--text-muted);
        cursor: default;
        font-style: italic;
        justify-content: flex-start;
    }
    .custom-select-option.empty:hover { background: transparent; }

    /* Layout integration */
    .schedule-select-row .custom-select { flex: 1 1 0; min-width: 0; }
    .filter-section > .custom-select { width: 100%; }

    .filter-section {
        background: var(--surface); border-radius: 12px;
        padding: 14px 16px; margin-bottom: 16px; border: 1px solid var(--border);
        display: flex; flex-direction: column; gap: 12px;
        transition: background 0.3s, border-color 0.3s;
    }
    .radio-group { display: flex; gap: 20px; align-items: center; }
    .radio-group label { display: flex; align-items: center; gap: 6px; font-weight: 500; color: var(--text); cursor: pointer; }
    .radio-group input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; }
    .compare-toggle-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .compare-toggle-row label { display: flex; align-items: center; gap: 8px; font-weight: 500; color: var(--text); cursor: pointer; font-size: 0.9rem; }
    .compare-toggle-row input[type="checkbox"] { accent-color: var(--green); width: 18px; height: 18px; cursor: pointer; }
    .compare-badge { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 10px; letter-spacing: 0.5px; white-space: nowrap; }
    .compare-badge.sched-a { background: var(--blue-bg); color: var(--schedule-label-a-color); border: 1px solid var(--accent); }
    .compare-badge.sched-b { background: var(--green-bg); color: var(--schedule-label-b-color); border: 1px solid var(--green); }
    .schedule-select-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .schedule-select-row .compare-badge { width: 24px; text-align: center; flex-shrink: 0; }
    #scheduleSelectsContainer { display: flex; flex-direction: column; gap: 8px; }
    #scheduleSelectsContainer.compare-active { flex-direction: row; align-items: flex-start; }
    #scheduleSelectsContainer.compare-active .schedule-select-row { flex-direction: column; align-items: stretch; flex: 1 1 0; gap: 4px; }
    #scheduleSelectsContainer.compare-active .compare-badge { align-self: flex-start; }
    #scheduleSelectsContainer.compare-active .schedule-select-row .custom-select { flex: 0 0 auto; width: 100%; }
    .week-indicator { font-size: 0.75rem; color: var(--green); margin-top: -6px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
    .week-indicator .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink-dot 1.5s ease-in-out infinite; }
    @keyframes blink-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Hidden native selects — kept in DOM so existing JS refs keep working */
    .hidden-native { display: none !important; }

    /* ===================== Mobile select popup (bottom sheet) ===================== */
    .mobile-select-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        z-index: 900;
        display: none;
        opacity: 0;
        transition: opacity 0.2s ease;
    }
    .mobile-select-backdrop.open {
        display: block;
        opacity: 1;
    }
    .mobile-select-sheet {
        position: fixed;
        left: 0; right: 0; bottom: 0;
        background: var(--surface);
        color: var(--text);
        border-top-left-radius: 18px;
        border-top-right-radius: 18px;
        box-shadow: 0 -10px 40px rgba(0,0,0,0.55);
        z-index: 901;
        max-height: 78vh;
        display: flex;
        flex-direction: column;
        transform: translateY(100%);
        transition: transform 0.25s ease;
        padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .mobile-select-sheet.open { transform: translateY(0); }
    .mobile-select-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 14px 12px 18px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
    }
    .mobile-select-title {
        font-weight: 600;
        font-size: 1rem;
        color: var(--text);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
    }
    .mobile-select-close {
        background: transparent;
        border: none;
        color: var(--text-muted);
        font-size: 1.6rem;
        line-height: 1;
        padding: 2px 10px;
        cursor: pointer;
        border-radius: 8px;
        flex-shrink: 0;
        font-weight: 400;
    }
    .mobile-select-close:hover { background: var(--surface2); color: var(--text); }
    .mobile-select-close:active { background: var(--accent); color: #fff; }
    .mobile-select-list {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 8px 10px 14px;
        flex: 1 1 auto;
        overscroll-behavior: contain;
    }
    .mobile-select-item {
        padding: 15px 16px;
        border-radius: 10px;
        font-size: 1rem;
        color: var(--text);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.1s;
    }
    .mobile-select-item:active { background: var(--surface2); }
    .mobile-select-item.selected {
        background: var(--accent);
        color: #fff;
        font-weight: 600;
    }
    .mobile-select-item.selected::after {
        content: '✓';
        font-size: 0.95rem;
        flex-shrink: 0;
    }
    .mobile-select-item.empty {
        color: var(--text-muted);
        font-style: italic;
        cursor: default;
        justify-content: center;
    }
    .mobile-select-item.empty::after { content: none; }

    .schedule-section { background: var(--surface); border-radius: 12px; padding: 16px; border: 1px solid var(--border); transition: background 0.3s, border-color 0.3s; }
    .day-header { font-size: 1.05rem; font-weight: 600; margin: 14px 0 8px 0; padding-bottom: 4px; border-bottom: 1px solid var(--day-header-border); color: var(--text-secondary); text-transform: uppercase; }
    .day-header:first-child { margin-top: 0; }
    .compare-day-header { font-size: 1.05rem; font-weight: 600; margin: 0 0 8px 0; padding-bottom: 4px; border-bottom: 1px solid var(--day-header-border); color: var(--text-secondary); text-transform: uppercase; }
    .compare-day-row { margin-bottom: 20px; }

    /* ===== Lesson card ===== */
    .lesson-card {
        background: var(--card-bg); border: 1px solid var(--card-border);
        border-radius: 8px; color: var(--text);
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        position: relative; transition: all 0.3s ease;
        scroll-margin-top: 60px;
    }
    .lesson-card.current-lesson { border-left: 4px solid var(--lesson-color, #fbbf24) !important; animation: pulse-glow 2s ease-in-out infinite; }
    .lesson-card.current-lesson::before { content: '▶'; position: absolute; left: 3px; top: 50%; transform: translateY(-50%); color: var(--lesson-color, #fbbf24); font-size: 0.75rem; animation: arrow-text-pulse 2s ease-in-out infinite; }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 6px var(--lesson-color), 0 0 12px var(--lesson-color), 0 2px 6px rgba(0,0,0,0.2); } 50% { box-shadow: 0 0 12px var(--lesson-color), 0 0 24px var(--lesson-color), 0 2px 6px rgba(0,0,0,0.2); } }
    @keyframes arrow-text-pulse { 0%, 100% { text-shadow: 0 0 6px var(--lesson-color), 0 0 12px var(--lesson-color); } 50% { text-shadow: 0 0 12px var(--lesson-color), 0 0 24px var(--lesson-color); } }

    /* ===== Current-time line ===== */
    .current-time-line {
        position: relative; height: 6px;
        background: #fbbf24; border: none; border-radius: 3px;
        animation: pulse-line 2s ease-in-out infinite;
        scroll-margin-top: 60px;
        margin: 18px 0 18px 24px;
    }
    .current-time-line::before { content: '▶'; position: absolute; left: -20px; top: 50%; transform: translateY(-50%); color: #fbbf24; font-size: 0.85rem; animation: arrow-text-pulse-line 2s ease-in-out infinite; }
    @keyframes pulse-line { 0%, 100% { box-shadow: 0 0 8px #fbbf24, 0 0 16px #fbbf24; } 50% { box-shadow: 0 0 16px #fbbf24, 0 0 32px #fbbf24; } }
    @keyframes arrow-text-pulse-line { 0%, 100% { text-shadow: 0 0 6px #fbbf24, 0 0 12px #fbbf24; } 50% { text-shadow: 0 0 12px #fbbf24, 0 0 24px #fbbf24; } }

    /* ===== Period-based grid ===== */
    .period-grid {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: repeat(var(--period-count, 8), var(--period-height, 74px));
        gap: 12px;
        width: 100%;
    }
    .period-grid-compare {
        grid-template-columns: 1fr 1fr;
        gap: 12px 8px;
    }

    .period-cell { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 4px; }
    .period-cell > .lesson-card {
        width: 100%; height: 100%; flex: 1 1 auto; margin-bottom: 0;
        overflow: hidden; overflow-wrap: break-word;
        padding: 9px 12px;
        display: flex; flex-direction: column; justify-content: flex-start;
    }
    .lesson-header { display: flex; align-items: baseline; justify-content: flex-start; gap: 8px; margin-bottom: 4px; }
    .lesson-subject { font-size: 1rem; font-weight: 700; line-height: 1.15; color: inherit; overflow-wrap: break-word; min-width: 0; flex: 0 1 auto; }
    .lesson-time { font-size: 0.8rem; font-weight: 500; opacity: 0.85; line-height: 1.1; white-space: nowrap; flex: 0 0 auto; font-variant-numeric: tabular-nums; }
    .lesson-details { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 0.78rem; line-height: 1.2; opacity: 0.95; }
    .lesson-details.stacked { flex-direction: column; align-items: flex-start; gap: 2px; }
    .lesson-details span { display: flex; align-items: center; gap: 3px; overflow-wrap: break-word; min-width: 0; }
    .period-cell > .lesson-card.current-lesson { padding-left: 20px; }
    .period-cell > .lesson-card.current-lesson::before { left: 3px; font-size: 0.75rem; }

    /* ===== Filler card for empty time before the first lesson ===== */
    .period-cell > .lesson-card.filler-card {
        background: transparent;
        border: 1px dashed var(--border);
        border-radius: 8px;
        color: var(--text-muted);
        box-shadow: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 8px;
        text-align: center;
        overflow: hidden;
        opacity: 0.7;
    }
    .filler-card .filler-time {
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        font-weight: 500;
    }
    .filler-card .filler-label {
        font-size: 0.7rem;
        font-style: italic;
        opacity: 0.85;
    }

    /* ===== Marker row ===== */
    .period-marker {
        position: relative;
        align-self: center;
        z-index: 3;
        pointer-events: none;
        min-height: 6px;
    }
    .period-marker > .current-time-line {
        position: absolute;
        left: 24px;
        right: 0;
        top: 50%;
        transform: translateY(-50%);
        margin: 0;
        height: 6px;
    }
    .period-marker > .current-time-line::before { left: -22px; }
    .period-grid-compare .period-marker > .current-time-line { left: 14px; }
    .period-grid-compare .period-marker > .current-time-line::before { left: -12px; font-size: 0.7rem; }

    /* Bottom marker placed at the very top of the first period row that
       follows a column's last lesson (compare mode). Sits flush against
       the bottom edge of that column's last card. */
    .period-marker.period-marker-bottom {
        align-self: start;
    }
    .period-marker.period-marker-bottom > .current-time-line {
        top: 0;
        transform: translateY(-50%);
    }

    .current-time-line.bottom-marker { margin: 14px 0 18px 24px; }
    .bottom-marker-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 8px;
        margin-top: 12px;
        margin-bottom: 6px;
    }
    .bottom-marker-cell { position: relative; min-height: 12px; }
    .bottom-marker-cell .current-time-line { margin: 0 0 0 14px; height: 5px; }
    .bottom-marker-cell .current-time-line::before { left: -12px; font-size: 0.7rem; }

    @media (max-width: 430px) {
        .period-grid { --period-height: 80px; gap: 11px; }
        .period-grid-compare { gap: 11px 6px; }
        .period-cell > .lesson-card { padding: 7px 9px; display: flex; flex-direction: column; justify-content: flex-start; }
        .lesson-header { gap: 6px; margin-bottom: 3px; }
        .lesson-subject { font-size: 0.88rem; }
        .lesson-time    { font-size: 0.72rem; }
        .lesson-details { font-size: 0.7rem; gap: 2px 8px; }
        .period-cell > .lesson-card.current-lesson { padding-left: 16px; }
        .period-cell > .lesson-card.current-lesson::before { left: 2px; font-size: 0.68rem; }
        .compare-day-header { font-size: 0.95rem; }
        .period-marker > .current-time-line { left: 16px; }
        .period-marker > .current-time-line::before { left: -14px; font-size: 0.7rem; }
        .period-grid-compare .period-marker > .current-time-line { left: 10px; }
        .period-grid-compare .period-marker > .current-time-line::before { left: -9px; font-size: 0.6rem; }
        .filler-card .filler-time { font-size: 0.7rem; }
        .filler-card .filler-label { font-size: 0.65rem; }
    }

    .empty-state { text-align: center; padding: 30px; color: var(--text-muted); font-style: italic; }
    .status-msg { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; min-height: 1.3em; }
    .status-msg.error { color: #ef4444; font-weight: 500; }
    .status-msg.success { color: #22c55e; font-weight: 500; }
    .progress-bar-wrap { width: 100%; height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; display: none; }
    .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; width: 0%; }
    .note { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; line-height: 1.3; }
    #selectedPdfNames { color: var(--text-secondary); font-size: 0.8rem; word-break: break-all; }

    .light-mode .lesson-card { box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .light-mode .current-time-line { background: #f59e0b; }
</style>
</head>
<body>
<div class="container">
    <div class="import-header">
        <h2>📋 Import Schedule</h2>
        <button id="themeToggle" class="theme-toggle">🌙 Dark</button>
    </div>
    <div class="import-section">
        <div class="tab-row">
            <button class="tab-btn active" data-tab="text">📝 Text</button>
            <button class="tab-btn" data-tab="pdf">📄 PDF</button>
            <button class="tab-btn" data-tab="online">🌐 Online</button>
        </div>
        <div class="tab-panel active" id="panelText">
            <textarea id="reportInput" placeholder="Paste your combined text report here..."></textarea>
            <div class="file-upload">
                <input type="file" id="fileInput" accept=".txt">
                <button id="loadFileBtn" class="btn-primary btn-sm">Load .txt</button>
            </div>
            <button id="parseBtn" class="btn-primary" style="width:100%;">Parse & Show Filters</button>
        </div>
        <div class="tab-panel" id="panelPdf">
            <div class="file-upload">
                <button type="button" id="selectPdfBtn" class="btn-primary" style="width:100%;">📂 Select PDFs</button>
                <input type="file" id="pdfFiles" multiple accept=".pdf" style="display:none;">
                <div id="selectedPdfNames"></div>
            </div>
            <button id="convertAllBtn" class="btn-primary" style="width:100%;">🔁 Convert PDFs & Load</button>
            <div class="progress-bar-wrap" id="progressWrap"><div class="progress-bar-fill" id="progressFill"></div></div>

    // ---------- Theme-aware color adjustment ----------
    function adjustColorForTheme(color) {
        if (!color) return color;
        let r, g, b, a = 1;
        const s = String(color).trim();
        if (s[0] === '#') {
            const hex = s.slice(1);
            if (hex.length === 3) {
                r = parseInt(hex[0] + hex[0], 16); g = parseInt(hex[1] + hex[1], 16); b = parseInt(hex[2] + hex[2], 16);
            } else if (hex.length === 6 || hex.length === 8) {
                r = parseInt(hex.slice(0, 2), 16); g = parseInt(hex.slice(2, 4), 16); b = parseInt(hex.slice(4, 6), 16);
                if (hex.length === 8) a = parseInt(hex.slice(6, 8), 16) / 255;
            } else { return color; }
        } else if (s.startsWith('rgb')) {
            const m = s.match(/rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)/);
            if (!m) return color;
            r = parseFloat(m[1]); g = parseFloat(m[2]); b = parseFloat(m[3]);
            if (m[4] !== undefined) a = parseFloat(m[4]);
        } else { return color; }
        const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
        if (document.body.classList.contains('light-mode')) {
            const MAX_BRIGHTNESS = 185;
            if (brightness <= MAX_BRIGHTNESS) return color;
            const scale = MAX_BRIGHTNESS / brightness;
            const nr = Math.max(0, Math.min(255, Math.round(r * scale)));
            const ng = Math.max(0, Math.min(255, Math.round(g * scale)));
            const nb = Math.max(0, Math.min(255, Math.round(b * scale)));
            return a < 1 ? `rgba(${nr},${ng},${nb},${a})` : `rgb(${nr},${ng},${nb})`;
        }
        const MIN_BRIGHTNESS = 110;
        if (brightness >= MIN_BRIGHTNESS) return color;
        const t = (MIN_BRIGHTNESS - brightness) / (255 - brightness);
        const nr = Math.round(r + (255 - r) * t);
        const ng = Math.round(g + (255 - g) * t);
        const nb = Math.round(b + (255 - b) * t);
        return a < 1 ? `rgba(${nr},${ng},${nb},${a})` : `rgb(${nr},${ng},${nb})`;
    }

    function parseReport(text) { const blocks = text.split(/\n\s*\n/).filter(b => b.trim()); const lessons = []; blocks.forEach(block => { const lines = block.split('\n'), entry = {}; lines.forEach(line => { const idx = line.indexOf(':'); if (idx === -1) return; const key = line.substring(0, idx).trim().toLowerCase(), val = line.substring(idx + 1).trim(); switch (key) { case 'start': entry.start = parseInt(val); break; case 'end': entry.end = parseInt(val); break; case 'day': entry.day = parseInt(val); break; case 'subject': entry.subject = val; break; case 'room': entry.room = val; break; case 'class': entry.className = val; break; case 'teacher': entry.teacher = val; break; case 'color': entry.color = val; break; case 'type': entry.type = parseInt(val); break; case 'week': entry.week = val; break; case 'group': entry.group = parseInt(val); break; } }); if (entry.start !== undefined && entry.end !== undefined && entry.day !== undefined && entry.subject && entry.className && entry.teacher) { if (!entry.color) entry.color = '#888888'; if (entry.group === undefined) entry.group = 0; if (!entry.week) entry.week = 'C'; if (!entry.room) entry.room = '?'; lessons.push(entry); } }); return lessons; }

    // ---------- Sorting helpers ----------
    function uppercaseClassSuffix(name) {
        return String(name || '').replace(/(\d+)([а-яa-z])/g, (_, num, letter) => num + letter.toUpperCase());
    }
    function classSortKey(name) {
        const norm = uppercaseClassSuffix(name);
        const m = norm.match(/^(\d+)(.*)$/);
        const grade = m ? parseInt(m[1], 10) : 999;
        const suffix = m ? m[2] : norm;
        const idx = CLASS_LETTER_ORDER.indexOf(suffix);
        return { grade, idx: (idx === -1 ? 999 : idx), suffix };
    }
    function compareClassNames(a, b) {
        const ka = classSortKey(a), kb = classSortKey(b);
        if (ka.grade !== kb.grade) return ka.grade - kb.grade;
        if (ka.idx !== kb.idx) return ka.idx - kb.idx;
        return ka.suffix.localeCompare(kb.suffix);
    }
    function sortClassNames(names) { return [...names].sort(compareClassNames); }
    function sortLessonsByClassThenTime(lessons) {
        return [...lessons].sort((a, b) => {
            const c = compareClassNames(a.className || '', b.className || '');
            if (c !== 0) return c;
            if (a.day !== b.day) return a.day - b.day;
            return a.start - b.start;
        });
    }

    // ---------- Populate selects ----------
    function getNamesForType(type) { const set = new Set(); if (type === 'class') allLessons.forEach(l => { if (l.className) set.add(l.className); }); else if (type === 'teacher') allLessons.forEach(l => { if (l.teacher) set.add(l.teacher); }); else if (type === 'room') allLessons.forEach(l => { if (l.room) set.add(l.room); }); let names = Array.from(set); if (type === 'class') names = sortClassNames(names); else names.sort(); return names; }
    function populateNameSelects() {
        const type = currentFilter.type;
        const names = getNamesForType(type);
        nameSelect.innerHTML = '';
        nameSelect2.innerHTML = '';
        if (names.length === 0) {
            nameSelect.innerHTML = '';
            nameSelect2.innerHTML = '';
            refreshAllCustomSelects();
            return;
        }
        names.forEach(n => {
            const o1 = document.createElement('option');
            o1.value = n; o1.textContent = n; nameSelect.appendChild(o1);

        }
        if (currentFilter.name2 && names.includes(currentFilter.name2)) {
            nameSelect2.value = currentFilter.name2;
        } else {
            if (names.length > 1) {

    function applySavedFilterToUI() {

        groupSelect2.value = currentFilter.group2;

        scheduleSelectsContainer.classList.toggle('compare-active', currentFilter.compareMode);

        refreshAllCustomSelects();

    }
    function toggleGroupVisibility() { const isClass = currentFilter.type === 'class'; document.querySelectorAll('.group-select').forEach(el => el.style.display = isClass ? '' : 'none'); if (!isClass) { groupSelect.value = 'A'; groupSelect2.value = 'A'; refreshAllCustomSelects(); } }

    // ---------- Filtering ----------
    function filterLessonsFor(filterObj) { const { type, name, group, week } = filterObj; const effectiveGroup = (type === 'class') ? (group || 'A') : 'A'; return allLessons.filter(l => { if (type === 'class' && l.className !== name) return false; if (type === 'teacher' && l.teacher !== name) return false; if (type === 'room' && l.room !== name) return false; if (type === 'class') { if (effectiveGroup === 'A' && ![0,1].includes(l.group)) return false; if (effectiveGroup === 'B' && ![0,2].includes(l.group)) return false; } if (week === 'A' && !['A','C'].includes(l.week)) return false; if (week === 'B' && !['B','C'].includes(l.week)) return false; return true; }); }
    function getGroupText(code) { if (code === 1) return 'Group A'; if (code === 2) return 'Group B'; return 'Both'; }
    function getLessonTimeString(start, end) { const s = START_TIMES[start] || '??:??', e = END_TIMES[end] || '??:??'; return `[${s} - ${e}]`; }

    // ---------- Rendering helpers ----------
    function sortLessons(list) { return [...list].sort((a, b) => a.start - b.start || a.subject.localeCompare(b.subject)); }

    function renderCardHTML(l, type, isCurrent) {
        const c = adjustColorForTheme(l.color || '#888888');
        const currentClass = isCurrent ? ' current-lesson' : '';
        const cardId = isCurrent ? ' id="current-lesson-card"' : '';

        let details;
        if (type === 'teacher') {

        } else if (type === 'room') {
            details = `<span>🏫 ${escapeHtml(l.className)}</span><span>👤 ${escapeHtml(l.teacher)}</span><span>👥 ${escapeHtml(getGroupText(l.group))}</span>`;
        } else {
            details = `<span>🏫 ${escapeHtml(l.className)}</span><span>👤 ${escapeHtml(l.teacher)}</span><span>🚪 ${escapeHtml(l.room)}</span>`;
        }

    }

    function renderFillerCardHTML(startPeriod, endPeriod) {
        const startTime = START_TIMES[startPeriod] || '??:??';
        const endTime = END_TIMES[endPeriod] || '??:??';
        return `<div class="lesson-card filler-card">`
            +   `<div class="filler-time">${startTime} – ${endTime}</div>`
            +   `<div class="filler-label">Free time</div>`
            + `</div>`;
    }

    function adjustDetailsLayout() {
        document.querySelectorAll('.lesson-details').forEach(el => {
            el.classList.remove('stacked');
            const kids = Array.from(el.children);
            if (kids.length < 2) return;

            const tops = kids.map(k => Math.round(k.getBoundingClientRect().top));
            const allSameLine = tops.every(t => t === tops[0]);
            if (allSameLine) return;

            el.classList.add('stacked');

            requestAnimationFrame(() => {
                if (!el.classList.contains('stacked')) return;
                const rects = Array.from(el.children).map(k => k.getBoundingClientRect());
                const uniqueTops = new Set(rects.map(r => Math.round(r.top)));
                if (uniqueTops.size < rects.length) {
                    el.classList.remove('stacked');
                }
            });
        });
    }

    function computeMarkerPeriod(lessons, currentDay, currentMinutes, dayIdx) {
        if (dayIdx !== currentDay || lessons.length === 0) return -2;
        if (lessons.some(l => isLessonCurrent(l, currentDay, currentMinutes))) return -2;
        for (let p = 0; p < MAX_PERIODS; p++) {
            const endP = timeToMinutes(END_TIMES[p + 1]);
            if (endP !== -1 && endP > currentMinutes) return p;
        }
        return MAX_PERIODS;
    }

    function renderDayHTML(dayLessons, type, currentDay, currentMinutes) {
        const sorted = sortLessons(dayLessons);
        if (sorted.length === 0) return '';

        const dayIdx = sorted[0].day;
        const firstStart = Math.min(...sorted.map(l => l.start));
        const lastEnd = Math.min(MAX_PERIODS, Math.max(1, Math.max(...sorted.map(l => l.end))));

        const atPeriod = new Map();
        sorted.forEach(l => {
            if (!atPeriod.has(l.start)) atPeriod.set(l.start, []);
            atPeriod.get(l.start).push(l);
        });

        let markerAt = computeMarkerPeriod(sorted, currentDay, currentMinutes, dayIdx);
        let bottomMarker = false;
        if (markerAt >= lastEnd && markerAt !== -2) { bottomMarker = true; markerAt = -2; }

        // ----- Row planning -----
        const rowSizes = [];
        const periodStartRow = {};
        let curRow = 1;
        for (let p = 0; p < lastEnd; p++) {
            if (markerAt === p) {
                rowSizes.push('var(--marker-row-height, 6px)');
                curRow++;
            }
            periodStartRow[p] = curRow;
            rowSizes.push('var(--period-height, 74px)');
            curRow++;
        }
        periodStartRow[lastEnd] = curRow;

        let html = `<div class="period-grid" style="grid-template-rows:${rowSizes.join(' ')};">`;

        // ----- Filler card (free time before the first lesson) -----
        const markerInFiller = (markerAt >= 0 && markerAt < firstStart);
        if (firstStart > 0 && !markerInFiller) {
            const rowStart = periodStartRow[0];
            const rowEnd   = periodStartRow[firstStart - 1] + 1;
            html += `<div class="period-cell" style="grid-row:${rowStart} / ${rowEnd};">`
                 +  renderFillerCardHTML(0, firstStart)
                 +  `</div>`;
        } else if (firstStart > 0 && markerInFiller) {
            if (markerAt > 0) {
                const rowStart = periodStartRow[0];
                const rowEnd   = periodStartRow[markerAt - 1] + 1;
                html += `<div class="period-cell" style="grid-row:${rowStart} / ${rowEnd};">`
                     +  renderFillerCardHTML(0, markerAt)
                     +  `</div>`;
            }
            const markerRow = periodStartRow[markerAt] - 1;
            html += `<div class="period-marker" style="grid-row:${markerRow};grid-column:1 / -1;">`
                 +  `<div class="current-time-line" id="current-time-marker"></div>`
                 +  `</div>`;
            const rowStart = periodStartRow[markerAt];
            const rowEnd   = periodStartRow[firstStart - 1] + 1;
            html += `<div class="period-cell" style="grid-row:${rowStart} / ${rowEnd};">`
                 +  renderFillerCardHTML(markerAt, firstStart)
                 +  `</div>`;
        } else if (markerAt >= 0 && markerAt < lastEnd) {
            const markerRow = periodStartRow[markerAt] - 1;
            html += `<div class="period-marker" style="grid-row:${markerRow};grid-column:1 / -1;">`
                 +  `<div class="current-time-line" id="current-time-marker"></div>`
                 +  `</div>`;
        }

        // ----- Lesson cards -----
        for (let p = 0; p < lastEnd; p++) {
            if (!atPeriod.has(p)) continue;
            const group = atPeriod.get(p);
            const endPeriod = Math.max(...group.map(l => l.end));
            const rowStart = periodStartRow[p];
            const rowEnd   = periodStartRow[endPeriod - 1] + 1;
            html += `<div class="period-cell" style="grid-row:${rowStart} / ${rowEnd};">`;
            group.forEach(l => {
                html += renderCardHTML(l, type, isLessonCurrent(l, currentDay, currentMinutes));
            });
            html += `</div>`;
        }

        html += `</div>`;

        if (bottomMarker) {
            html += `<div class="current-time-line bottom-marker" id="current-time-marker"></div>`;
        }
        return html;
    }

    function renderCompareDay(dayIdx, lessonsA, lessonsB, type, currentDay, currentMinutes) {
        const a = sortLessons(lessonsA);
        const b = sortLessons(lessonsB);
        if (a.length === 0 && b.length === 0) return '';

        const lastEndA = a.length ? Math.min(MAX_PERIODS, Math.max(1, Math.max(...a.map(l => l.end)))) : 0;
        const lastEndB = b.length ? Math.min(MAX_PERIODS, Math.max(1, Math.max(...b.map(l => l.end)))) : 0;
        const lastEnd = Math.max(lastEndA, lastEndB);

        const buildMap = list => {
            const m = new Map();
            list.forEach(l => {
                if (!m.has(l.start)) m.set(l.start, []);
                m.get(l.start).push(l);
            });
            return m;
        };
        const atA = buildMap(a);
        const atB = buildMap(b);

        const firstStartA = a.length ? Math.min(...a.map(l => l.start)) : -1;
        const firstStartB = b.length ? Math.min(...b.map(l => l.start)) : -1;

        let markerAtA = computeMarkerPeriod(a, currentDay, currentMinutes, dayIdx);
        let markerAtB = computeMarkerPeriod(b, currentDay, currentMinutes, dayIdx);
        let bottomA = false, bottomB = false;
        if (markerAtA >= lastEnd && markerAtA !== -2) { bottomA = true; markerAtA = -2; }
        if (markerAtB >= lastEnd && markerAtB !== -2) { bottomB = true; markerAtB = -2; }

        // ----- Row planning (union of both columns' marker rows) -----
        const markerPositions = new Set();
        if (markerAtA >= 0 && markerAtA < lastEnd) markerPositions.add(markerAtA);
        if (markerAtB >= 0 && markerAtB < lastEnd) markerPositions.add(markerAtB);

        const rowSizes = [];
        const periodStartRow = {};
        let curRow = 1;
        for (let p = 0; p < lastEnd; p++) {
            if (markerPositions.has(p)) {
                rowSizes.push('var(--marker-row-height, 6px)');
                curRow++;
            }
            periodStartRow[p] = curRow;
            rowSizes.push('var(--period-height, 74px)');
            curRow++;
        }
        periodStartRow[lastEnd] = curRow;

        // If either column needs its bottom marker AFTER the last period row,
        // append one shared extra row at the end for it/them.
        let bottomExtraRow = -1;
        const needExtraForA = bottomA && lastEndA >= lastEnd;
        const needExtraForB = bottomB && lastEndB >= lastEnd;
        if (needExtraForA || needExtraForB) {
            bottomExtraRow = curRow;
            rowSizes.push('var(--marker-row-height, 6px)');
            curRow++;
        }

        let html = `<div class="period-grid period-grid-compare" style="grid-template-rows:${rowSizes.join(' ')};">`;

        const emitFiller = (col, firstStart, markerAt) => {
            if (firstStart <= 0) return '';
            const markerInFiller = (markerAt >= 0 && markerAt < firstStart);
            let out = '';
            if (!markerInFiller) {
                const rowStart = periodStartRow[0];
                const rowEnd   = periodStartRow[firstStart - 1] + 1;
                out += `<div class="period-cell" style="grid-column:${col};grid-row:${rowStart} / ${rowEnd};">`
                     +  renderFillerCardHTML(0, firstStart)
                     +  `</div>`;
            } else {
                if (markerAt > 0) {
                    const rowStart = periodStartRow[0];
                    const rowEnd   = periodStartRow[markerAt - 1] + 1;
                    out += `<div class="period-cell" style="grid-column:${col};grid-row:${rowStart} / ${rowEnd};">`
                         +  renderFillerCardHTML(0, markerAt)
                         +  `</div>`;
                }
                const rowStart = periodStartRow[markerAt];
                const rowEnd   = periodStartRow[firstStart - 1] + 1;
                out += `<div class="period-cell" style="grid-column:${col};grid-row:${rowStart} / ${rowEnd};">`
                     +  renderFillerCardHTML(markerAt, firstStart)
                     +  `</div>`;
            }
            return out;
        };
        html += emitFiller(1, firstStartA, markerAtA);
        html += emitFiller(2, firstStartB, markerAtB);

        const emitMarker = (col, markerAt) => {
            if (markerAt < 0 || markerAt >= lastEnd) return '';
            const markerRow = periodStartRow[markerAt] - 1;
            const id = col === 1 ? 'current-time-marker-a' : 'current-time-marker-b';
            return `<div class="period-marker" style="grid-row:${markerRow};grid-column:${col};">`
                 +  `<div class="current-time-line" id="${id}"></div>`
                 +  `</div>`;
        };
        html += emitMarker(1, markerAtA);
        html += emitMarker(2, markerAtB);

        const emitCards = (col, map) => {
            let out = '';
            for (let p = 0; p < lastEnd; p++) {
                if (!map.has(p)) continue;
                const group = map.get(p);
                const endPeriod = Math.max(...group.map(l => l.end));
                const rowStart = periodStartRow[p];
                const rowEnd   = periodStartRow[endPeriod - 1] + 1;
                out += `<div class="period-cell" style="grid-column:${col};grid-row:${rowStart} / ${rowEnd};">`;
                group.forEach(l => {
                    out += renderCardHTML(l, type, isLessonCurrent(l, currentDay, currentMinutes));
                });
                out += `</div>`;
            }
            return out;
        };
        html += emitCards(1, atA);
        html += emitCards(2, atB);

        // Bottom markers — placed INSIDE the grid so each one sits right after
        // its own column's last lesson. If the column spans all the way to the
        // grid's last period row, its marker lands in the extra row we added.
        const emitBottomMarker = (col, flag, colLastEnd) => {
            if (!flag) return '';
            const markerRow = (colLastEnd < lastEnd)
                ? periodStartRow[colLastEnd]   // top of the next period row
                : bottomExtraRow;              // extra row at the very end
            if (markerRow < 0) return '';
            const id = col === 1 ? 'current-time-marker-a' : 'current-time-marker-b';
            return `<div class="period-marker period-marker-bottom" style="grid-row:${markerRow};grid-column:${col};">`
                 +  `<div class="current-time-line" id="${id}"></div>`
                 +  `</div>`;
        };
        html += emitBottomMarker(1, bottomA, lastEndA);
        html += emitBottomMarker(2, bottomB, lastEndB);

        html += `</div>`;

        return html;
    }

    // ---------- Main render ----------
    function renderSchedule() {
        const type = currentFilter.type;
        const week = weekSelect.value;
        const currentDay = getCurrentDayIndex();
        const currentMinutes = getCurrentTimeMinutes();

        if (currentFilter.compareMode) {
            const group1 = (type === 'class') ? groupSelect.value : 'A';
            const group2 = (type === 'class') ? groupSelect2.value : 'A';
            const f1 = { type, name: nameSelect.value, group: group1, week };
            const f2 = { type, name: nameSelect2.value, group: group2, week };
            const lessons1 = filterLessonsFor(f1);
            const lessons2 = filterLessonsFor(f2);

            let html = '';
            for (let d = 0; d < 5; d++) {
                const dayA = lessons1.filter(l => l.day === d);
                const dayB = lessons2.filter(l => l.day === d);
                if (dayA.length === 0 && dayB.length === 0) continue;
                html += `<div class="compare-day-row">`;
                html += `<div class="compare-day-header">${DAY_NAMES[d]}</div>`;
                html += renderCompareDay(d, dayA, dayB, type, currentDay, currentMinutes);
                html += `</div>`;
            }
            if (html === '') html = '<div class="empty-state">No lessons match the current filters.</div>';
            scheduleSection.innerHTML = html;
            requestAnimationFrame(adjustDetailsLayout);
            return;
        } else {
            const group = (type === 'class') ? groupSelect.value : 'A';
            const f = { type, name: nameSelect.value, group, week };
            const lessons = filterLessonsFor(f);
            let html = '';
            for (let d = 0; d < 5; d++) {
                const dayLessons = lessons.filter(l => l.day === d);
                if (dayLessons.length === 0) continue;
                html += `<div class="day-header">${DAY_NAMES[d]}</div>`;
                html += renderDayHTML(dayLessons, type, currentDay, currentMinutes);
            }
            if (html === '') html = '<div class="empty-state">No lessons match the current filters.</div>';
            scheduleSection.innerHTML = html;
            requestAnimationFrame(adjustDetailsLayout);
            return;
        }
    }

    function performInitialScrollIfNeeded() { if (initialScrollDone) return; initialScrollDone = true; const indicator = scheduleSection.querySelector('.current-lesson') || scheduleSection.querySelector('.period-marker') || scheduleSection.querySelector('.current-time-line'); if (indicator) scrollToCurrentLesson(); }

    // ---------- Update ----------

        currentFilter.name = nameSelect.value;
        currentFilter.name2 = nameSelect2.value;
        currentFilter.group = (currentFilter.type === 'class') ? groupSelect.value : 'A';

        toggleGroupVisibility();
        secondScheduleSelect.style.display = currentFilter.compareMode ? '' : 'none';

    function showFiltersAndSchedule() {

        importStatus.textContent = `Loaded ${allLessons.length} lessons.`;
        importStatus.className = 'status-msg success';
        performInitialScrollIfNeeded();

    // ---------- Parse button ----------
    function handleParse() {
        const text = reportInput.value.trim();
        if (!text) { setStatus('Please paste or load a report first.', 'error'); return; }
        allLessons = sortLessonsByClassThenTime(parseReport(text));
        combinedReportText = generateCombinedReportFromLessons(allLessons);
        if (allLessons.length === 0) {
            setStatus('No valid schedule entries found.', 'error');
            filterSection.style.display = 'none';
            scheduleSection.style.display = 'none';
        } else showFiltersAndSchedule();
        saveToStorage();
    }

    function groupTextsInSVG(svg) {
        const doc = new DOMParser().parseFromString(svg,'image/svg+xml'); const svgEl = doc.querySelector('svg'); if(!svgEl) throw new Error('no svg');

                if(isMain(node)) {
                    const items=[node]; let j=i+1;
                    while(j<children.length && children[j].nodeType===1 && children[j].tagName.toLowerCase()==='text' && !isMain(children[j])) { items.push(children[j]); j++; }

    function snapAndExtend(svg) {

            let cs=Math.floor((x-GRID.xMin)/GRID.colW), ce=Math.ceil((x+w-GRID.xMin)/GRID.colW)-1; cs=Math.max(0,Math.min(GRID.cols-1,cs)); ce=Math.max(0,Math.min(GRID.cols-1,ce)); if(cs>ce){r.remove();return;}

    async function recolorForegroundPaths(fgSvgString, bgSvgString) {

    function processSVGToReport(svg, classLabel) {
        const div = document.createElement('div'); div.style.cssText='position:absolute;visibility:hidden;width:0;height:0;'; div.innerHTML=svg; document.body.appendChild(div);
        let blocks=[];
        try{
            const svgEl = div.querySelector('svg'); const root=svgEl;
            svgEl.querySelectorAll('g[id^="block-"]').forEach(g=>{
                const path=g.querySelector('path'); if(!path) return;
                const texts=Array.from(g.querySelectorAll('text')); const cnt=texts.length; if(cnt!==3&&cnt!==4) return;
                const bb = getRootBBox(path, root); if(!bb) return;
                const minX=bb.x, minY=bb.y, w=bb.width, h=bb.height; const maxX=minX+w, centerY=minY+h/2;
                const subject=texts[0]?.textContent?.trim()||'', teacher=texts[1]?.textContent?.trim()||'', room=texts[2]?.textContent?.trim()||'';
                const color=getFill(path);
                let dayIdx=Math.floor((centerY-RECT.minY)/DAY_HEIGHT+0.001); dayIdx=Math.max(0,Math.min(4,dayIdx));
                let startDiv=Math.round((minX-RECT.minX)/X_DIV); startDiv=Math.max(0,Math.min(8,startDiv));
                let endDiv=Math.round((maxX-RECT.minX)/X_DIV); endDiv=Math.max(0,Math.min(8,endDiv));
                blocks.push({minX,minY,maxX,width:w,height:h,textCount:cnt,subject,teacher,room,color,startDiv,endDiv,dayIdx});
            });

            if(Math.abs(h-DAY_HEIGHT/2)<=TOLERANCE && cnt===3) { const half=Math.round((cy-dayTop)/(DAY_HEIGHT/2)-0.5); return {type:2,week:half===0?'A':'B',group:0}; }
            if(Math.abs(h-DAY_HEIGHT/2)<=TOLERANCE && cnt===4) { const half=Math.round((cy-dayTop)/(DAY_HEIGHT/2)-0.5); return {type:3,week:'C',group:half===0?1:2}; }
            if(Math.abs(h-DAY_HEIGHT/4)<=TOLERANCE && cnt===4) { const q=Math.round((cy-dayTop)/(DAY_HEIGHT/4)-0.5); const idx=Math.min(3,Math.max(0,q)); return {type:4,week:idx<=1?'A':'B',group:idx%2===0?1:2}; }

        blocks.sort((a,b)=>a.dayIdx-b.dayIdx||a.startDiv-b.startDiv||a.minY-b.minY);
        return blocks.map(b=>`Start: ${b.startDiv}\nEnd: ${b.endDiv}\nDay: ${b.dayIdx}\nSubject: ${b.subject}\nRoom: ${b.room}\nClass: ${classLabel}\nTeacher: ${b.teacher}\nColor: ${b.color}\nType: ${b.type}\nWeek: ${b.week}\nGroup: ${b.group}`).join('\n\n');
    }

    async function processPDFBuffer(arrayBuffer, grade) {
        const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
        const numPages = pdf.numPages; const pages = [];
        for(let i=1;i<=numPages;i++){
            const page = await pdf.getPage(i);
            const rawSvg = await convertPageToRawSvg(page);
            const bgSvg = await getBackgroundSvg(page);
            const classLabel = detectClassFromSVG(rawSvg) || `${grade}?`;

        }

    }

    async function processAllPages(pagesArray) {

            if(a.grade!==b.grade) return a.grade - b.grade;
            const aL=(a.classLabel||'').slice(-1).toUpperCase();
            const bL=(b.classLabel||'').slice(-1).toUpperCase();
            const ai=CLASS_LETTER_ORDER.indexOf(aL), bi=CLASS_LETTER_ORDER.indexOf(bL);
            if(ai!==-1 && bi!==-1 && ai!==bi) return ai - bi;
            if(ai!==-1 && bi===-1) return -1;
            if(ai===-1 && bi!==-1) return 1;
            return (a.classLabel||'').localeCompare(b.classLabel||'');
        });
        for(const p of pagesArray) {
            const filtered = filterSVG(p.rawSvg);
            const grouped = groupTextsInSVG(filtered);
            const snapped = snapAndExtend(grouped.svgString);
            const recolored = await recolorForegroundPaths(snapped, p.bgSvg);
            p.recoloredSvg = recolored;
            p.report = processSVGToReport(recolored, p.classLabel);
            await new Promise(r => setTimeout(r,0));
        }
        return pagesArray;
    }

    function mergeNewPages(newPagesArray) {
        const existingClasses = new Set(allLessons.map(l => l.className));
        let addedCount=0, skippedCount=0; const newLessons=[];
        for(const page of newPagesArray) {
            if(page.report) {
                const lessons = parseReport(page.report);
                const classSet = new Set(lessons.map(l => l.className));
                const alreadyHas = [...classSet].some(c => existingClasses.has(c));
                if(alreadyHas) { skippedCount += lessons.length; continue; }
                newLessons.push(...lessons); addedCount += lessons.length;
            }
        }
        if(newLessons.length > 0) {
            allLessons = sortLessonsByClassThenTime([...allLessons, ...newLessons]);
            combinedReportText = generateCombinedReportFromLessons(allLessons);
            reportInput.value = combinedReportText;
        }
        return { added: addedCount, skipped: skippedCount };
    }

    function generateCombinedReportFromLessons(lessons) {
        const sorted = sortLessonsByClassThenTime(lessons);
        return sorted.map(l => `Start: ${l.start}\nEnd: ${l.end}\nDay: ${l.day}\nSubject: ${l.subject}\nRoom: ${l.room}\nClass: ${l.className}\nTeacher: ${l.teacher}\nColor: ${l.color}\nType: ${l.type}\nWeek: ${l.week}\nGroup: ${l.group}`).join('\n\n');
    }

    async function fetchPDFViaNetlifyFunction(url) {
        const response = await fetch(`/api/fetch-pdf?url=${encodeURIComponent(url)}`);
        if (!response.ok) throw new Error(`Netlify function returned ${response.status}`);
        return await response.arrayBuffer();
    }

    function getGradeFromFilename(filename) {
        const match = filename.match(/(\d+)/);
        if(match) { const n = parseInt(match[1]); if(n>=8 && n<=12) return n; }
        return 0;
    }

    // ==================== EVENT LISTENERS ====================
    selectPdfBtn.addEventListener('click', () => pdfFilesInput.click());
    pdfFilesInput.addEventListener('change', () => {
        const files = pdfFilesInput.files;
        selectedPdfNames.textContent = files && files.length > 0 ? `Selected: ${Array.from(files).map(f=>f.name).join(', ')}` : '';
    });

    convertAllBtn.addEventListener('click', async () => {
        const files = pdfFilesInput.files;
        if(!files || files.length === 0) { setStatus('⚠️ No PDFs selected.', 'error'); return; }
        const allPages = [];
        convertAllBtn.disabled = true; progressWrap.style.display = 'block'; progressFill.style.width = '0%';
        downloadCombinedBtn.style.display = 'none'; copyCombinedBtn.style.display = 'none'; downloadRecoloredBtn.style.display = 'none';
        try {
            for(let i=0; i<files.length; i++) {
                const file = files[i]; const grade = getGradeFromFilename(file.name);
                setStatus(`Processing ${file.name} (grade ${grade})...`, '');
                const buf = await file.arrayBuffer(); const pages = await processPDFBuffer(buf, grade);
                allPages.push(...pages);
                progressFill.style.width = Math.round(((i+1)/files.length)*80) + '%';
            }
            if(allPages.length === 0) { setStatus('⚠️ No pages extracted.', 'error'); return; }
            await processAllPages(allPages);
            const result = mergeNewPages(allPages);
            globalRecoloredSvgs = allPages.map(p => ({classLabel: p.classLabel, svg: p.recoloredSvg}));
            showFiltersAndSchedule();
            setStatus(`✅ Added ${result.added} lessons, skipped ${result.skipped}.`, 'success');
        } catch(e) { setStatus('❌ Processing failed: ' + e.message, 'error'); }
        finally {
            convertAllBtn.disabled = false; progressWrap.style.display = 'none';
            saveToStorage(); pdfFilesInput.value = ''; selectedPdfNames.textContent = '';
        }
    });

    fetchOnlineBtn.addEventListener('click', async () => {
        const grades = [8,9,10,11,12];
        const urls = grades.map(g => ({grade:g, url: urlInputs[g].value.trim()})).filter(x => x.url);
        if(urls.length===0) { setStatus('⚠️ No URLs entered.', 'error'); return; }
        fetchOnlineBtn.disabled = true; onlineProgressWrap.style.display = 'block'; onlineProgressFill.style.width = '0%';
        onlineDownloadCombinedBtn.style.display = 'none'; onlineCopyCombinedBtn.style.display = 'none'; onlineDownloadRecoloredBtn.style.display = 'none';
        let allNewPages = []; let remaining = urls, attempt = 0; const maxAttempts = MAX_RETRIES + 1;
        const doAttempt = async (items) => {
            const results = await Promise.allSettled(items.map(async ({grade,url}) => {
                const buf = await fetchPDFViaNetlifyFunction(url); const pages = await processPDFBuffer(buf, grade); return {grade, pages};
            }));
            const successes = [], failures = [];
            results.forEach((res, idx) => { if(res.status==='fulfilled') successes.push(res.value); else failures.push(items[idx]); });
            return { successes, failures };
        };
        while(remaining.length > 0 && attempt < maxAttempts) {
            attempt++;
            setStatus(`Attempt ${attempt}/${maxAttempts} – fetching ${remaining.length} grade(s)…`, '');
            const { successes, failures } = await doAttempt(remaining);
            remaining = failures;
            for(const {pages} of successes) { allNewPages.push(...pages); }
            onlineProgressFill.style.width = Math.round((attempt/maxAttempts)*80) + '%';
            if(remaining.length > 0 && attempt < maxAttempts) await new Promise(r => setTimeout(r, RETRY_DELAY_MS));
        }
        if(allNewPages.length === 0) { setStatus('❌ Could not fetch any PDFs.', 'error'); fetchOnlineBtn.disabled = false; onlineProgressWrap.style.display = 'none'; return; }
        try {
            setStatus('⚙️ Processing pages…', '');
            await processAllPages(allNewPages);
            const mergeResult = mergeNewPages(allNewPages);
            globalRecoloredSvgs = allNewPages.map(p => ({classLabel: p.classLabel, svg: p.recoloredSvg}));
            showFiltersAndSchedule();
            let msg = `✅ Added ${mergeResult.added} lessons.`; if(mergeResult.skipped > 0) msg += ` Skipped ${mergeResult.skipped}.`; if(remaining.length > 0) msg += ` ${remaining.length} grade(s) failed.`;
            setStatus(msg, 'success');
        } catch(e) { setStatus('❌ Processing failed: ' + e.message, 'error'); }
        finally { fetchOnlineBtn.disabled = false; onlineProgressWrap.style.display = 'none'; saveToStorage(); }
    });

    function downloadReport() {
        if(!combinedReportText) { setStatus('⚠️ No report.', 'error'); return; }
        const blob = new Blob([combinedReportText], {type:'text/plain'}); const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'combined_schedule.txt'; a.click();
        setStatus('📄 Downloaded.', 'success');
    }
    async function copyReport() {
        if(!combinedReportText) { setStatus('⚠️ No report.', 'error'); return; }
        try { await navigator.clipboard.writeText(combinedReportText); setStatus('📋 Copied!', 'success'); }
        catch { setStatus('❌ Copy failed.', 'error'); }
    }
    async function downloadRecoloredSvgs() {
        if(!globalRecoloredSvgs.length) { setStatus('⚠️ No recolored SVGs.', 'error'); return; }
        const zip = new JSZip();
        globalRecoloredSvgs.forEach(({classLabel, svg}, i) => { zip.file(`overlay_${classLabel.replace(/[^\w]/g,'_')}_page${i+1}.svg`, svg); });
        const blob = await zip.generateAsync({type:'blob'}); const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'recolored_overlays.zip'; a.click();
        setStatus('🎨 Recolored SVGs downloaded.', 'success');
    }

    downloadCombinedBtn.addEventListener('click', downloadReport);
    copyCombinedBtn.addEventListener('click', copyReport);
    downloadRecoloredBtn.addEventListener('click', downloadRecoloredSvgs);
    onlineDownloadCombinedBtn.addEventListener('click', downloadReport);
    onlineCopyCombinedBtn.addEventListener('click', copyReport);
    onlineDownloadRecoloredBtn.addEventListener('click', downloadRecoloredSvgs);

    parseBtn.addEventListener('click', handleParse);
    loadFileBtn.addEventListener('click', () => {
        const file = fileInput.files[0]; if(!file) { setStatus('No file selected.', 'error'); return; }
        const reader = new FileReader();
        reader.onload = e => { reportInput.value = e.target.result; setStatus('Loaded. Click Parse.', 'success'); saveToStorage(); };
        reader.onerror = () => setStatus('Error reading file.', 'error');
        reader.readAsText(file, 'UTF-8');
    });
    for(const r of viewTypeRadios) r.addEventListener('change', () => {
        if (!r.checked) return;
        const newType = r.value;
        if (currentFilter.type === newType) return;
        stashCurrentFilter();
        applyTypeFilterToCurrent(newType);
        applySavedFilterToUI();
    });
    nameSelect.addEventListener('change', updateSchedule);
    nameSelect2.addEventListener('change', updateSchedule);
    compareToggle.addEventListener('change', () => { currentFilter.compareMode = compareToggle.checked; updateSchedule(); });
    groupSelect.addEventListener('change', updateSchedule);
    groupSelect2.addEventListener('change', updateSchedule);
    weekSelect.addEventListener('change', () => { weekManuallyChanged = true; updateSchedule(); });
    reportInput.addEventListener('input', () => saveToStorage());

    function setStatus(msg, type) {
        importStatus.textContent = msg; importStatus.className = 'status-msg';
        if(type==='error') importStatus.className = 'status-msg error';
        if(type==='success') importStatus.className = 'status-msg success';
    }

    // ---------- Initialize ----------
    initTheme();
    loadFromStorage();
    initCustomSelects();

    const detectedWeek = getCurrentWeekType();
    currentFilter.week = detectedWeek; weekSelect.value = detectedWeek; weekManuallyChanged = false;
    for (const r of viewTypeRadios) r.checked = (r.value === currentFilter.type);
    compareToggle.checked = currentFilter.compareMode;
    secondScheduleSelect.style.display = currentFilter.compareMode ? '' : 'none';
    scheduleSelectsContainer.classList.toggle('compare-active', currentFilter.compareMode);
    toggleGroupVisibility();
    updateWeekIndicator();
    refreshAllCustomSelects();

    if(allLessons.length > 0) {
        showFiltersAndSchedule();
        if(combinedReportText) {
            downloadCombinedBtn.style.display = 'inline-flex'; copyCombinedBtn.style.display = 'inline-flex';
            onlineDownloadCombinedBtn.style.display = 'inline-flex'; onlineCopyCombinedBtn.style.display = 'inline-flex';
        }
    } else {
        setStatus('Paste text, upload PDFs, or fetch via URL.', '');
    }
    if(combinedReportText && !reportInput.value) reportInput.value = combinedReportText;
})();
</script>
</body>
</html>
